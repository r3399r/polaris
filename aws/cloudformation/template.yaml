AWSTemplateFormatVersion: '2010-09-09'
Transform: "AWS::Serverless-2016-10-31"
Description: polaris deployment cloudformation script
    
# More info about Globals: https://github.com/awslabs/serverless-application-model/blob/master/docs/globals.rst
Globals:
  Function:
      Timeout: 30  # in seconds
Parameters:
  Project:
    Type: String
  TargetEnvr:
    Type: String
    Description: The target environment for API Gateway deployment.
Conditions:
  # cost saving resources only exist in the test environment
  IsTestEnvr: !Equals [!Ref TargetEnvr, test]
Resources:
  ##########################################
  ##### AWS IAM Role to execute lambda #####
  ##########################################
  ExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service:
                - lambda.amazonaws.com
            Action:
              - sts:AssumeRole
      RoleName: !Sub ${Project}-${TargetEnvr}-lambda-execution-role
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
        - arn:aws:iam::aws:policy/AWSLambda_FullAccess
        - arn:aws:iam::aws:policy/AmazonSQSFullAccess
        - arn:aws:iam::aws:policy/AmazonEC2FullAccess
  ############################################
  ##### AWS IAM Role to stop the test db #####
  ############################################
  # scoped to the single test instance, so it can never touch prod
  StopDbExecutionRole:
    Type: AWS::IAM::Role
    Condition: IsTestEnvr
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service:
                - lambda.amazonaws.com
            Action:
              - sts:AssumeRole
      RoleName: !Sub ${Project}-${TargetEnvr}-stop-db-role
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: !Sub ${Project}-${TargetEnvr}-stop-db-policy
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              # rds:DescribeDBInstances does not support resource-level permissions
              - Effect: Allow
                Action: rds:DescribeDBInstances
                Resource: '*'
              - Effect: Allow
                Action: rds:StopDBInstance
                Resource: !Sub arn:aws:rds:${AWS::Region}:${AWS::AccountId}:db:celestial-studio-mysql-${TargetEnvr}
  ###############################################
  ##### AWS IAM Role for the db-switch ui   #####
  ##### scoped to the single test instance  #####
  ###############################################
  DbSwitchExecutionRole:
    Type: AWS::IAM::Role
    Condition: IsTestEnvr
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service:
                - lambda.amazonaws.com
            Action:
              - sts:AssumeRole
      RoleName: !Sub ${Project}-${TargetEnvr}-db-switch-role
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: !Sub ${Project}-${TargetEnvr}-db-switch-policy
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              # rds:DescribeDBInstances does not support resource-level permissions
              - Effect: Allow
                Action: rds:DescribeDBInstances
                Resource: '*'
              - Effect: Allow
                Action:
                  - rds:StartDBInstance
                  - rds:StopDBInstance
                Resource: !Sub arn:aws:rds:${AWS::Region}:${AWS::AccountId}:db:celestial-studio-mysql-${TargetEnvr}
  #################################################
  ##### AWS IAM Role for the stop-db schedule #####
  #################################################
  StopDbSchedulerRole:
    Type: AWS::IAM::Role
    Condition: IsTestEnvr
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service:
                - scheduler.amazonaws.com
            Action:
              - sts:AssumeRole
      RoleName: !Sub ${Project}-${TargetEnvr}-stop-db-scheduler-role
      Policies:
        - PolicyName: !Sub ${Project}-${TargetEnvr}-stop-db-invoke-policy
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: lambda:InvokeFunction
                Resource: !GetAtt LambdaStopDb.Arn
  ##############################################
  ##### API Gateway and associated Lambdas #####
  ##############################################
  LambdaMonitor:
    Type: AWS::Serverless::Function
    Properties:
      Architectures: [arm64]
      Handler: index.eventBridgeMonitor
      Runtime: nodejs24.x
      FunctionName: !Sub ${Project}-${TargetEnvr}-monitor
      Role: !GetAtt ExecutionRole.Arn
      CodeUri: ../../lib/src
      MemorySize: 160
      Layers: [!Ref LambdaLayer]
      Environment:
        Variables:
          PROJECT: !Sub ${Project}
          COCKROACH_DB_CLUSTER: !Sub '{{resolve:ssm:${TargetEnvr}-db-cluster}}'
          COCKROACH_DB_HOST: !Sub '{{resolve:ssm:${TargetEnvr}-db-host}}'
          COCKROACH_DB_PASSWORD: !Sub '{{resolve:ssm:${TargetEnvr}-db-pwd}}'
          COCKROACH_DB_USER: !Sub '{{resolve:ssm:${TargetEnvr}-db-user}}'
          SHEET_ID: !Sub '{{resolve:ssm:${Project}-${TargetEnvr}-spreadsheet-id}}'
          CLIENT_EMAIL: !Sub '{{resolve:ssm:${Project}-${TargetEnvr}-client-email}}'
          PRIVATE_KEY: !Sub '{{resolve:ssm:${Project}-${TargetEnvr}-private-key}}'
          SQL_LIMIT: 500
  InvokePermissionMonitor:
    Type: AWS::Lambda::Permission
    DependsOn: [EventBridgeMonitor, LambdaMonitor]
    Properties:
      FunctionName: !Sub ${Project}-${TargetEnvr}-monitor
      Action: 'lambda:InvokeFunction'
      Principal: events.amazonaws.com
      SourceArn: !GetAtt EventBridgeMonitor.Arn
  LambdaHouseKeeping:
    Type: AWS::Serverless::Function
    Properties:
      Architectures: [arm64]
      Handler: index.eventBridgeHouseKeeping
      Runtime: nodejs24.x
      FunctionName: !Sub ${Project}-${TargetEnvr}-house-keeping
      Role: !GetAtt ExecutionRole.Arn
      CodeUri: ../../lib/src
      MemorySize: 128
      Timeout: 180
      Layers: [!Ref LambdaLayer]
      Environment:
        Variables:
          PROJECT: !Sub ${Project}
          COCKROACH_DB_CLUSTER: !Sub '{{resolve:ssm:${TargetEnvr}-db-cluster}}'
          COCKROACH_DB_HOST: !Sub '{{resolve:ssm:${TargetEnvr}-db-host}}'
          COCKROACH_DB_PASSWORD: !Sub '{{resolve:ssm:${TargetEnvr}-db-pwd}}'
          COCKROACH_DB_USER: !Sub '{{resolve:ssm:${TargetEnvr}-db-user}}'
          MYSQL_DB_HOST:
            Fn::ImportValue: !Sub celestial-studio-${TargetEnvr}-db-endpoint
          MYSQL_DB_PASSWORD: !Sub '{{resolve:ssm:mysql-${TargetEnvr}-${Project}-pwd}}'
          RESET_SQL_STATS: false
  InvokePermissionHouseKeeping:
    Type: AWS::Lambda::Permission
    DependsOn: [EventBridgeHouseKeeping, LambdaHouseKeeping]
    Properties:
      FunctionName: !Sub ${Project}-${TargetEnvr}-house-keeping
      Action: 'lambda:InvokeFunction'
      Principal: events.amazonaws.com
      SourceArn: !GetAtt EventBridgeHouseKeeping.Arn
  LambdaLogger:
    Type: AWS::Serverless::Function
    Properties:
      Architectures: [arm64]
      Handler: index.logger
      Runtime: nodejs24.x
      FunctionName: !Sub ${Project}-${TargetEnvr}-logger
      Role: !GetAtt ExecutionRole.Arn
      CodeUri: ../../lib/src
      MemorySize: 128
      Layers: [!Ref LambdaLayer]
      Environment:
        Variables:
          PROJECT: !Sub ${Project}
          MYSQL_DB_HOST:
            Fn::ImportValue: !Sub celestial-studio-${TargetEnvr}-db-endpoint
          MYSQL_DB_PASSWORD: !Sub '{{resolve:ssm:mysql-${TargetEnvr}-${Project}-pwd}}'
  LambdaStopDb:
    Type: AWS::Serverless::Function
    Condition: IsTestEnvr
    Properties:
      Architectures: [arm64]
      Handler: index.eventBridgeStopDb
      Runtime: nodejs24.x
      FunctionName: !Sub ${Project}-${TargetEnvr}-stop-db
      Role: !GetAtt StopDbExecutionRole.Arn
      CodeUri: ../../lib/src
      MemorySize: 128
      Layers: [!Ref LambdaLayer]
      Environment:
        Variables:
          MYSQL_DB_HOST:
            Fn::ImportValue: !Sub celestial-studio-${TargetEnvr}-db-endpoint
  # Manual start/stop UI. AuthType NONE because a browser cannot sign SigV4;
  # the whole url path is a secret held in SSM and checked in the handler, so an
  # unauthenticated request never reaches the RDS api.
  LambdaDbSwitch:
    Type: AWS::Serverless::Function
    Condition: IsTestEnvr
    Properties:
      Architectures: [arm64]
      Handler: index.dbSwitch
      Runtime: nodejs24.x
      FunctionName: !Sub ${Project}-${TargetEnvr}-db-switch
      Role: !GetAtt DbSwitchExecutionRole.Arn
      CodeUri: ../../lib/src
      MemorySize: 128
      Layers: [!Ref LambdaLayer]
      FunctionUrlConfig:
        AuthType: NONE
      Environment:
        Variables:
          MYSQL_DB_HOST:
            Fn::ImportValue: !Sub celestial-studio-${TargetEnvr}-db-endpoint
          UI_SECRET: !Sub '{{resolve:ssm:${Project}-${TargetEnvr}-ui-secret}}'
  LambdaLayer:
    Type: AWS::Serverless::LayerVersion
    Properties:
      LayerName: !Sub ${Project}-${TargetEnvr}-layer
      CompatibleArchitectures: [arm64]
      CompatibleRuntimes: [nodejs24.x]
      ContentUri: ../../dist
      RetentionPolicy: Delete
  #######################
  ######### SQS #########
  #######################
  EventSourceMapping:
    Type: AWS::Lambda::EventSourceMapping
    DependsOn: [LambdaLogger]
    Properties:
      FunctionName: !GetAtt LambdaLogger.Arn
      EventSourceArn: 
        Fn::ImportValue: !Sub ${Project}-${TargetEnvr}-logger-queue-arn
      BatchSize: 50
      MaximumBatchingWindowInSeconds: 300
      ScalingConfig:
        MaximumConcurrency: 2
      Enabled: true
  #######################
  ##### EventBridge #####
  #######################
  EventBridgeMonitor:
    Type: AWS::Events::Rule
    DependsOn: [LambdaMonitor]
    Properties:
      Name: !Sub ${Project}-${TargetEnvr}-monitor
      ScheduleExpression: cron(1 0 * * ? *)
      State: ENABLED
      Targets: 
        - Arn: !GetAtt LambdaMonitor.Arn
          Id: !Sub ${Project}-${TargetEnvr}-monitor
  EventBridgeHouseKeeping:
    Type: AWS::Events::Rule
    DependsOn: [LambdaHouseKeeping]
    Properties:
      Name: !Sub ${Project}-${TargetEnvr}-house-keeping
      ScheduleExpression: cron(31 19 * * ? *)
      State: ENABLED
      Targets: 
        - Arn: !GetAtt LambdaHouseKeeping.Arn
          Id: !Sub ${Project}-${TargetEnvr}-house-keeping
  #################################
  ##### EventBridge Scheduler #####
  #################################
  # EventBridge Scheduler (not Events::Rule) so the hours can be written in local
  # time. In UTC these are 21:00 the previous day and 11:00, which is readable
  # only with a comment, and stops being expressible as one rule the moment a
  # day-of-week restriction is added.
  ScheduleStopDb:
    Type: AWS::Scheduler::Schedule
    Condition: IsTestEnvr
    Properties:
      Name: !Sub ${Project}-${TargetEnvr}-stop-db
      Description: Stop the test db at 05:00 and 19:00 Taiwan time
      State: ENABLED
      # 05:00 catches an instance left running overnight after late-evening dev,
      # 19:00 catches one left running after weekend daytime dev
      ScheduleExpression: cron(0 5,19 * * ? *)
      ScheduleExpressionTimezone: Asia/Taipei
      FlexibleTimeWindow:
        Mode: 'OFF'
      Target:
        Arn: !GetAtt LambdaStopDb.Arn
        RoleArn: !GetAtt StopDbSchedulerRole.Arn
        RetryPolicy:
          MaximumRetryAttempts: 2
Outputs:
  DbSwitchBaseUrl:
    Condition: IsTestEnvr
    Description: Append the ui secret as the path to get the working url
    Value: !GetAtt LambdaDbSwitchUrl.FunctionUrl
